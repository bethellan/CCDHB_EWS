.modal{display:none;position:fixed;z-index:5000;inset:0;background:rgba(0,0,0,.82);padding:18px;align-items:center;justify-content:center}.modal.open{display:flex}.modal-panel{width:100%;max-width:720px;max-height:86dvh;background:#fff;border-radius:18px;box-shadow:0 20px 60px rgba(0,0,0,.35);overflow:hidden;display:grid;grid-template-rows:auto 1fr}.modal-head{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 14px;border-bottom:1px solid var(--line)}.modal-head h3{margin:0;font-size:20px;font-weight:950}.close-button{width:44px;height:44px;border-radius:12px;background:#e9edf3;font-size:24px;font-weight:950;color:var(--ink)}.modal-body{overflow:auto;padding:14px}.legend-section{margin-bottom:16px}.legend-section h4{margin:0 0 8px;font-size:16px}.legend-table{width:100%;border-collapse:separate;border-spacing:0;border:1px solid var(--line);border-radius:12px;overflow:hidden}.legend-table th,.legend-table td{padding:8px;border-bottom:1px solid var(--line);font-size:13px;text-align:left;vertical-align:top}.legend-table td{white-space:pre-line}.escalation-prompt{padding:10px 12px;border-radius:12px;background:#fff8e6;border:1px solid #f4d48d;font-weight:800;margin-bottom:10px}.legend-table th{background:#f0f5fa;font-size:12px;text-transform:uppercase;letter-spacing:.05em}.legend-table tr:last-child td{border-bottom:0}

<script>
'use strict';
const APP_VERSION='v70';
const SCREENS=['mainMenu','ageMenu','entryScreen','summaryScreen'];
const $=id=>document.getElementById(id);
let config=null, activeSystem=null, activeAgeBand=null, activeParameters=[], currentStep=0, entries=[], lastSummary=null;
function escapeHtml(value){return String(value ?? '').replace(/[&<>\"]/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[ch]));}

let audioCtx=null,alarmTimer=null,vibrateTimer=null,alarmSilenced=false,alarmPrimed=false,alarmAudio=null;
function getAlarmAudio(){
  if(!alarmAudio){
    alarmAudio=new Audio('assets/audio/met-pet-alarm.wav?v='+encodeURIComponent(APP_VERSION));
    alarmAudio.preload='auto';
    alarmAudio.loop=true;
    alarmAudio.volume=1.0;
  }
  return alarmAudio;
}
function primeAlarmAudio(){
  if(alarmPrimed) return;
  alarmPrimed=true;
  try{ getAlarmAudio().load(); }catch(e){}
  try{
    const Ctx=window.AudioContext||window.webkitAudioContext;
    if(Ctx && !audioCtx){audioCtx=new Ctx();}
  }catch(e){audioCtx=null;}
}
function playSoftTripleAlarmPulse(){
  // Fallback only: used if the browser refuses the pre-rendered audio file.
  try{
    const Ctx=window.AudioContext||window.webkitAudioContext;
    if(!audioCtx && Ctx) audioCtx=new Ctx();
    if(!audioCtx) return;
    if(audioCtx.state==='suspended') audioCtx.resume();

    const now=audioCtx.currentTime;
    const master=audioCtx.createGain();
    master.gain.setValueAtTime(0.0001,now);
    master.gain.exponentialRampToValueAtTime(0.95,now+0.025);
    master.gain.exponentialRampToValueAtTime(0.0001,now+0.95);
    master.connect(audioCtx.destination);

    [0,0.24,0.48].forEach(offset=>{
      [660,990].forEach((freq,idx)=>{
        const osc=audioCtx.createOscillator();
        const gain=audioCtx.createGain();
        const start=now+offset;
        const end=start+0.18;
        osc.type='sine';
        osc.frequency.setValueAtTime(freq,start);
        gain.gain.setValueAtTime(0.0001,start);
        gain.gain.exponentialRampToValueAtTime(idx?0.35:0.9,start+0.016);
        gain.gain.exponentialRampToValueAtTime(0.0001,end);
        osc.connect(gain).connect(master);
        osc.start(start);
        osc.stop(end+0.03);
      });
    });
  }catch(e){}
}
function vibrateEmergency(){
  try{ if(navigator.vibrate) navigator.vibrate([220,90,220,650]); }catch(e){}
}
function startEmergencyAlarm(){
  if(alarmSilenced) return;
  stopEmergencyAlarm(false);
  vibrateEmergency();
  vibrateTimer=setInterval(vibrateEmergency,5200);
  try{
    const audio=getAlarmAudio();
    audio.pause();
    audio.currentTime=0;

function attachLongPressBack(button, tapHandler, longHandler){
  const LONG_PRESS_MS=650;
  let timer=null;
  let longFired=false;
  function clearTimer(){if(timer){clearTimeout(timer);timer=null;}}
  function start(e){
    longFired=false;
    clearTimer();
    timer=setTimeout(()=>{longFired=true;timer=null;longHandler();},LONG_PRESS_MS);
  }
  function cancel(){clearTimer();}
  function end(e){
    clearTimer();
    if(longFired){
      e.preventDefault();
      e.stopPropagation();
      return;
    }
    tapHandler();
  }
  button.addEventListener('pointerdown',start);
  button.addEventListener('pointerup',end);
  button.addEventListener('pointercancel',cancel);
  button.addEventListener('pointerleave',cancel);
  button.addEventListener('contextmenu',e=>e.preventDefault());
}

function blockZoomGestures(){

  document.addEventListener('gestureend',e=>e.preventDefault());

function bindTap(el,handler){
  if(!el) return;
  let lastRun=0;

    const now=Date.now();
    if(now-lastRun<450) return;

    handler(e);

function bindAppTap(el,handler){
  if(!el) return;
  let lastRun=0;
  const run=e=>{
    const now=Date.now();
    if(now-lastRun<380){
      if(e){e.preventDefault(); e.stopPropagation();}
      return;
    }
    lastRun=now;
    if(e){e.preventDefault(); e.stopPropagation();}
    try{ handler(e); }catch(err){ console.error('Control handler failed',err); }
  };
  // Android Chrome/WebView can miss pointerup on fixed-position controls;
  // bind touchend, pointerup and click, then de-duplicate by timestamp.
  el.addEventListener('touchend',run,{passive:false});
  el.addEventListener('pointerup',run);
  el.addEventListener('click',run);
  el.addEventListener('keyup',e=>{ if(e.key==='Enter'||e.key===' '){ run(e); } });
}

document.addEventListener('DOMContentLoaded',init);
